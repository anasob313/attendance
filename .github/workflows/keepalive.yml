# Optional: keeps a FREE Supabase project from pausing during long breaks
# (free projects pause after ~7 days without activity). Daily use of the app
# already counts as activity; this covers holidays.
# Uses repository variables SUPABASE_URL and SUPABASE_ANON_KEY (public values).
name: supabase-keepalive
on:
  schedule:
    - cron: '23 6 */2 * *'   # every 2 days
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
