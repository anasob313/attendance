# Optional: keeps a FREE Supabase project from pausing during long breaks
# (free projects pause after ~7 days without activity). Daily use of the app
# already counts as activity; this covers holidays.
# Uses the public Supabase URL and publishable key (same as .env.production).
name: supabase-keepalive
on:
  schedule:
    - cron: '23 6 */2 * *'   # every 2 days
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS -X POST "https://jhofnqvnjbxobjisfukx.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_5Gq-gOjaMtCIDmIPv6ofvw_UgNqikHd" \
            -H "Content-Type: application/json" -d '{}'
