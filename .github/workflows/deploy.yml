# Tests, builds and publishes the app on every push to main.
# The site is served by GitHub Pages from the `gh-pages` branch at
# https://<owner>.github.io/<repo>/ (same URL after every update).
# Public build values come from .env.production; no private keys are used.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Database tests (real migration in PGlite)
        run: npm run test:db
      - name: Build
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]; then export BASE_PATH=/; else export BASE_PATH="/$repo/"; fi
          npm run build
          cp dist/index.html dist/404.html   # deep links (SPA fallback)
          touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
